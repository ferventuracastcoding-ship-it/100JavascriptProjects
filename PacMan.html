
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man Arcade</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080b18;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.arcade {
  width: 100%;
  max-width: 850px;
  text-align: center;
}

h1 {
  color: #ffe600;
  letter-spacing: 5px;
  text-shadow: 0 0 15px #ffe600;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px 0;
}

.stat {
  background: #151d35;
  border: 1px solid #34466e;
  border-radius: 10px;
  padding: 14px 5px;
}

.stat span {
  display: block;
  color: #8fa9d9;
  font-size: 12px;
  margin-bottom: 7px;
}

.stat strong {
  font-size: 24px;
  color: #ffe600;
}

#game {
  display: block;
  width: 100%;
  max-width: 600px;
  margin: auto;
  background: #000;
  border: 4px solid #263dff;
  border-radius: 8px;
  box-shadow: 0 0 25px #172cff66;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0;
}

button {
  background: #263dff;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #5265ff;
}

#message {
  min-height: 28px;
  color: #ffe600;
  font-weight: bold;
}

.instructions {
  color: #aab6d5;
  font-size: 14px;
}

@media(max-width: 500px) {
  .stat strong {
    font-size: 18px;
  }

  h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>
<div class="arcade">

  <h1>PAC-MAN ARCADE</h1>

  <div class="dashboard">
    <div class="stat">
      <span>SCORE</span>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <span>TIME LEFT</span>
      <strong id="timer">90</strong>
    </div>

    <div class="stat">
      <span>HIGH SCORE</span>
      <strong id="highScore">0</strong>
    </div>
  </div>

  <canvas id="game" width="600" height="480"></canvas>

  <div class="controls">
    <button onclick="startGame()">START / RESTART</button>
    <button onclick="togglePause()">PAUSE / RESUME</button>
  </div>

  <div id="message">Press START to play!</div>

  <p class="instructions">
    Move: Arrow Keys or WASD | Eat power pellets to turn ghosts blue!
  </p>

</div>

<script>
// ==========================================
// PAC-MAN ARCADE GAME
// ==========================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreDisplay = document.getElementById("score");
const timerDisplay = document.getElementById("timer");
const highScoreDisplay = document.getElementById("highScore");
const message = document.getElementById("message");

// Game settings
const TILE = 30;
const COLS = 20;
const ROWS = 16;

let score = 0;
let timeLeft = 90;
let highScore = Number(localStorage.getItem("pacmanHighScore")) || 0;

let running = false;
let paused = false;
let gameOver = false;

let timerInterval;
let animationId;
let lastFrame = 0;

const player = {
  x: 1,
  y: 1,
  direction: "right",
  nextDirection: "right",
  mouth: 0
};

// 0 = dot, 1 = wall, 2 = empty, 3 = power pellet
const originalMap = [
"11111111111111111111",
"10000000000000000001",
"10111011101110111001",
"10300000000000000301",
"10111011011011011001",
"10000000000000000001",
"11101110111011101111",
"10000000000000000001",
"10111011011011011001",
"10000000000000000001",
"10300000000000000301",
"10111011101110111001",
"10000000000000000001",
"10110111011011101101",
"10000000000000000001",
"11111111111111111111"
];

let map = [];

let ghosts = [];

const ghostColors = ["#ff3030", "#ff8cdd", "#00e5ff", "#ff9f24"];

// Initialize map and characters
function initializeGame() {

  map = originalMap.map(row =>
    row.split("").map(Number)
  );

  player.x = 1;
  player.y = 1;
  player.direction = "right";
  player.nextDirection = "right";

  ghosts = [
    { x: 18, y: 1, color: ghostColors[0], moveTime: 0 },
    { x: 18, y: 14, color: ghostColors[1], moveTime: 0 },
    { x: 1, y: 14, color: ghostColors[2], moveTime: 0 },
    { x: 10, y: 7, color: ghostColors[3], moveTime: 0 }
  ];
}

// ==========================================
// DRAW THE MAZE
// ==========================================

function drawMap() {

  for (let y = 0; y < ROWS; y++) {

    for (let x = 0; x < COLS; x++) {

      const tile = map[y][x];

      if (tile === 1) {

        ctx.fillStyle = "#162eae";
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);

        ctx.strokeStyle = "#526bff";
        ctx.strokeRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);

      } else if (tile === 0) {

        ctx.fillStyle = "#ffe8ad";
        ctx.beginPath();
        ctx.arc(
          x * TILE + TILE / 2,
          y * TILE + TILE / 2,
          3,
          0,
          Math.PI * 2
        );
        ctx.fill();

      } else if (tile === 3) {

        ctx.fillStyle = "#fff";
        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.arc(
          x * TILE + TILE / 2,
          y * TILE + TILE / 2,
          8,
          0,
          Math.PI * 2
        );
        ctx.fill();

        ctx.shadowBlur = 0;
      }
    }
  }
}

// ==========================================
// DRAW PAC-MAN
// ==========================================

function drawPlayer() {

  const x = player.x * TILE + TILE / 2;
  const y = player.y * TILE + TILE / 2;

  const angles = {
    right: 0,
    down: Math.PI / 2,
    left: Math.PI,
    up: -Math.PI / 2
  };

  const angle = angles[player.direction];
  const mouthAngle = 0.2 + Math.abs(Math.sin(player.mouth)) * 0.5;

  ctx.fillStyle = "#ffe600";
  ctx.beginPath();

  ctx.moveTo(x, y);

  ctx.arc(
    x,
    y,
    12,
    angle + mouthAngle,
    angle + Math.PI * 2 - mouthAngle
  );

  ctx.closePath();
  ctx.fill();
}

// ==========================================
// DRAW GHOSTS
// ==========================================

let powerTime = 0;

function drawGhosts() {

  ghosts.forEach(ghost => {

    const x = ghost.x * TILE + TILE / 2;
    const y = ghost.y * TILE + TILE / 2;

    const frightened = powerTime > 0;

    ctx.fillStyle = frightened
      ? (powerTime < 2 && Math.floor(Date.now() / 200) % 2 === 0
          ? "#fff" : "#174cff")
      : ghost.color;

    ctx.beginPath();

    ctx.arc(x, y - 2, 12, Math.PI, 0);
    ctx.lineTo(x + 12, y + 11);
    ctx.lineTo(x + 6, y + 7);
    ctx.lineTo(x, y + 11);
    ctx.lineTo(x - 6, y + 7);
    ctx.lineTo(x - 12, y + 11);
    ctx.closePath();
    ctx.fill();

    // Ghost eyes
    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(x - 5, y - 3, 4, 0, Math.PI * 2);
    ctx.arc(x + 5, y - 3, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.arc(x - 5, y - 3, 2, 0, Math.PI * 2);
    ctx.arc(x + 5, y - 3, 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ==========================================
// MOVEMENT AND COLLISION
// ==========================================

const directions = {
  right: [1, 0],
  left: [-1, 0],
  up: [0, -1],
  down: [0, 1]
};

function canMove(x, y) {

  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) {
    return false;
  }

  return map[y][x] !== 1;
}

function movePlayer() {

  const next = directions[player.nextDirection];

  if (canMove(player.x + next[0], player.y + next[1])) {
    player.direction = player.nextDirection;
  }

  const direction = directions[player.direction];

  const newX = player.x + direction[0];
  const newY = player.y + direction[1];

  if (canMove(newX, newY)) {
    player.x = newX;
    player.y = newY;
  }

  // Collect dots and power pellets
  const tile = map[player.y][player.x];

  if (tile === 0) {
    map[player.y][player.x] = 2;
    addScore(10);
  }

  if (tile === 3) {
    map[player.y][player.x] = 2;
    addScore(50);
    powerTime = 8;
    message.textContent = "POWER MODE! EAT THE GHOSTS!";
  }
}

// ==========================================
// GHOST ARTIFICIAL INTELLIGENCE
// ==========================================

function moveGhosts(deltaTime) {

  ghosts.forEach(ghost => {

    ghost.moveTime += deltaTime;

    if (ghost.moveTime < 0.28) return;

    ghost.moveTime = 0;

    const possibleMoves = Object.keys(directions)
      .filter(direction => {

        const [dx, dy] = directions[direction];

        return canMove(ghost.x + dx, ghost.y + dy);
      });

    if (possibleMoves.length === 0) return;

    // Ghosts usually choose a direction closer to Pac-Man
    possibleMoves.sort((a, b) => {

      const [ax, ay] = directions[a];
      const [bx, by] = directions[b];

      const distanceA =
        Math.abs(ghost.x + ax - player.x) +
        Math.abs(ghost.y + ay - player.y);

      const distanceB =
        Math.abs(ghost.x + bx - player.x) +
        Math.abs(ghost.y + by - player.y);

      return powerTime > 0
        ? distanceB - distanceA
        : distanceA - distanceB;
    });

    // Sometimes choose a random move for variety
    const chosen = Math.random() < 0.2
      ? possibleMoves[Math.floor(Math.random() * possibleMoves.length)]
      : possibleMoves[0];

    const [dx, dy] = directions[chosen];

    ghost.x += dx;
    ghost.y += dy;
  });
}

// ==========================================
// GHOST COLLISIONS
// ==========================================

function checkGhostCollision() {

  ghosts.forEach((ghost, index) => {

    if (ghost.x === player.x && ghost.y === player.y) {

      if (powerTime > 0) {

        // Eat ghost!
        addScore(200);

        ghost.x = 18;
        ghost.y = 14;

        message.textContent = "GHOST EATEN! +200 POINTS";

      } else {

        endGame("A GHOST CAUGHT YOU!");

      }
    }
  });
}

// ==========================================
// SCORE AND HIGH SCORE
// ==========================================

function addScore(points) {

  score += points;

  scoreDisplay.textContent = score;

  if (score > highScore) {

    highScore = score;

    localStorage.setItem("pacmanHighScore", highScore);

    highScoreDisplay.textContent = highScore;
  }
}

// ==========================================
// GAME LOOP
// ==========================================

function gameLoop(timestamp) {

  if (!running || paused || gameOver) return;

  const deltaTime = Math.min((timestamp - lastFrame) / 1000 || 0, 0.05);
  lastFrame = timestamp;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  player.mouth += deltaTime * 12;

  if (powerTime > 0) {
    powerTime = Math.max(0, powerTime - deltaTime);
  }

  // Move Pac-Man at a steady interval
  player.moveTime = (player.moveTime || 0) + deltaTime;

  if (player.moveTime >= 0.12) {
    player.moveTime = 0;
    movePlayer();
  }

  moveGhosts(deltaTime);

  checkGhostCollision();

  if (!gameOver) {
    drawMap();
    drawPlayer();
    drawGhosts();

    // Win when all dots and power pellets are collected
    const remainingDots = map.flat().some(tile =>
      tile === 0 || tile === 3
    );

    if (!remainingDots) {
      endGame("YOU CLEARED THE MAZE!");
      return;
    }
  }

  if (running && !paused && !gameOver) {
    animationId = requestAnimationFrame(gameLoop);
  }
}

// ==========================================
// TIMER
// ==========================================

function startTimer() {

  clearInterval(timerInterval);

  timerInterval = setInterval(() => {

    if (!running || paused || gameOver) return;

    timeLeft--;

    timerDisplay.textContent = timeLeft;

    if (timeLeft <= 0) {
      endGame("TIME IS UP!");
    }

  }, 1000);
}

// ==========================================
// START AND RESTART
// ==========================================

function startGame() {

  cancelAnimationFrame(animationId);
  clearInterval(timerInterval);

  score = 0;
  timeLeft = 90;
  powerTime = 0;

  running = true;
  paused = false;
  gameOver = false;

  player.moveTime = 0;

  scoreDisplay.textContent = score;
  timerDisplay.textContent = timeLeft;
  highScoreDisplay.textContent = highScore;

  initializeGame();

  message.textContent = "GAME STARTED! COLLECT THE DOTS!";

  lastFrame = 0;

  drawMap();
  drawPlayer();
  drawGhosts();

  startTimer();

  animationId = requestAnimationFrame(gameLoop);
}

// ==========================================
// PAUSE AND RESUME
// ==========================================

function togglePause() {

  if (!running || gameOver) return;

  paused = !paused;

  if (paused) {

    clearInterval(timerInterval);
    cancelAnimationFrame(animationId);

    message.textContent = "GAME PAUSED";

  } else {

    message.textContent = "KEEP PLAYING!";

    lastFrame = 0;

    startTimer();

    animationId = requestAnimationFrame(gameLoop);
  }
}

// ==========================================
// END GAME
// ==========================================

function endGame(reason) {

  running = false;
  gameOver = true;

  clearInterval(timerInterval);
  cancelAnimationFrame(animationId);

  message.textContent = reason + " FINAL SCORE: " + score;
}

// ==========================================
// KEYBOARD CONTROLS
// ==========================================

document.addEventListener("keydown", event => {

  const keys = {
    ArrowRight: "right",
    ArrowLeft: "left",
    ArrowUp: "up",
    ArrowDown: "down",
    d: "right",
    a: "left",
    w: "up",
    s: "down"
  };

  const direction = keys[event.key] || keys[event.key.toLowerCase()];

  if (direction) {
    event.preventDefault();
    player.nextDirection = direction;
  }

  if (event.key === " ") {
    event.preventDefault();
    togglePause();
  }
});

// ==========================================
// INITIAL DISPLAY
// ==========================================

highScoreDisplay.textContent = highScore;

initializeGame();
drawMap();
drawPlayer();
drawGhosts();

</script>
</body>
</html>
